name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub Actions UI

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  AWS_REGION: eu-central-1

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test -- --forceExit --detectOpenHandles --passWithNoTests

  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clouddrop-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/clouddrop-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=http://${{ secrets.EC2_HOST }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/clouddrop-ui:latest
            ${{ secrets.DOCKER_USERNAME }}/clouddrop-ui:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/clouddrop_v2

            # Pull latest images from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/clouddrop-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/clouddrop-ui:latest

            # Restart services
            docker compose down --remove-orphans
            docker compose up -d

            # Health check
            sleep 15
            curl -f http://localhost:5000/health || exit 1
            echo "✅ Deployment successful - ${{ github.sha }}"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.event_name }}"